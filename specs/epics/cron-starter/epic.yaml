# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (CR → CR-1, CR-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: cron-starter
  key: CR
spec:
  title: "Vercel's Cron Jobs example on Cloudflare Workers with Cron Triggers and Workers KV"
  summary: "Vercel's Cron Jobs example — seven cron schedules, each requesting /api/cron/<interval> to record the newest Hacker News story and the run time in Vercel KV, and a page that polls /api/data/<interval> for them — runs on Cloudflare Workers + Static Assets through @opennextjs/cloudflare. The seven schedules run on the same Worker: a custom worker entry re-exports the generated fetch handler and adds a scheduled handler that turns each schedule due at a Cron Trigger's scheduled time back into the request Vercel used to make, so the template's own route runs on schedule — since CR4 from one every-minute trigger per Worker, which keeps a product inside Workers Free's Cron Trigger limit. The timestamps live in a Workers KV namespace provisioned by Terraform through Orun and bound through the Cirrus baseline's wiring documents."
  state: completed
  milestones:
    - name: "CR0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [CR-1]
    - name: "CR1 — the crons on Workers"
      exitCriteria:
        - "apps/web is the upstream template with the two API routes reading and writing the KV binding through lib/kv.ts"
        - "the seven vercel.json schedules are triggers.crons on the Worker and the scheduled handler runs /api/cron/<interval> through the OpenNext fetch handler"
        - "the wrangler config renders per environment from the cloudflare-kv root's wiring document (fixture in verify, live in deploy)"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev --test-scheduled` serves the page, a fired trigger writes the interval's record, and /api/data/<interval> answers it"
      tasks: [CR-2]
    - name: "CR2 — the KV namespace from Terraform"
      exitCriteria:
        - "infra/terraform/cloudflare-kv provisions the stage and prod namespaces and publishes the wiring document the app renders from"
      tasks: [CR-3]
    - name: "CR3 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it, lists the schedules, and says how to watch a trigger fire"
        - "the as-built status records every departure from the upstream template"
      tasks: [CR-4]
    - name: "CR4 — a baseline, in one landing"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new product from nothing to live on stage and prod in ONE landing (01-product) and a hook-only record (02-docs)"
        - "the product's own push-to-main plan applies cloudflare-kv before it deploys web, and the landing's await finds WIRING_CLOUDFLARE_KV on stage and prod"
        - "the Worker registers ONE Cron Trigger (every minute) and dispatches the seven schedules from its scheduled time, so a product fits the Workers Free plan"
        - "the deploy's smoke reads a run the trigger recorded; the end-to-end tier fires the scheduled handler in the built Worker at times that make each schedule due and reads every record back"
        - "a product built from it carries the product only, renamed throughout to its own name, repository, Worker and namespace titles"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [CR-5]
    - name: "CR5 — the cirrus standard"
      exitCriteria:
        - "no file outside this milestone's own record names kiox: orun is pinned where CI runs it (the orun-action `version:` in each workflow)"
        - "every component carries generated docs/{overview,architecture,runbook}.md, and Baseline CI fails a pull request whose manifests and pages disagree"
        - "ai/context carries this repository's current.md, decisions.md and open-risks.md, and none of them ships to a product"
        - "every milestone's status row agrees with the tags"
        - "the console card reads subdomain from the Cloudflare connection (from: connection.cloudflare.workersSubdomain), as cirrus-baseline since baseline-v23"
      tasks: [CR-6, CR-7]
    - name: "CR6 — the domain is set later"
      exitCriteria:
        - "the console card asks for no domain: a site goes live on workers.dev, and productdomain is an optional build input that defaults to empty"
        - "a site built without a domain is branded with the reserved placeholder <reponame>.example.com wherever the domain goes (BASE_DOMAIN), and its README says how an owner sets the real one"
        - "Baseline CI places, leak-checks and plans a site built with no domain"
      tasks: [CR-8]
